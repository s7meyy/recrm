<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>العروض المتاحة</title>
  <meta name="description" content="العروض العقارية المتاحة للعرض على العملاء.">
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <header class="hero">
    <div class="wrap">
      <div class="office">
        <img id="logo" class="logo" alt="" hidden>
        <div>
          <h1 id="office-name">العروض المتاحة</h1>
          <p id="office-contact" class="office-contact"></p>
        </div>
      </div>
      <p id="intro" class="intro"></p>
      <button type="button" id="lang-toggle" class="btn btn-sm lang-toggle">English</button>
    </div>
  </header>

  <main class="wrap">
    <div id="filters" class="filters" hidden></div>
    <p id="status" class="status">جارٍ تحميل العروض…</p>
    <div id="grid" class="grid"></div>
  </main>

  <section class="wrap lead-box">
    <h2>اطلب معاينة أو اسأل عن عقار</h2>
    <p class="muted small">اترك رقمك ونتواصل معك. لا يُنشر رقمك ولا يظهر لأحد غير المكتب.</p>
    <form id="lead-form" novalidate>
      <div class="lead-grid">
        <label>الاسم<input type="text" name="name" autocomplete="name" maxlength="60"></label>
        <label>الجوال <span aria-hidden="true">*</span><input type="tel" name="phone" inputmode="tel" dir="ltr" autocomplete="tel" required maxlength="20"></label>
      </div>
      <label class="lead-full">ما الذي تبحث عنه؟<textarea name="note" rows="2" maxlength="400"></textarea></label>
      <label class="lead-trap" aria-hidden="true" tabindex="-1">لا تملأ هذا الحقل<input type="text" name="website" tabindex="-1" autocomplete="off"></label>
      <button type="submit" class="btn btn-primary" id="lead-send">إرسال</button>
      <p id="lead-status" class="muted small" role="status"></p>
    </form>
  </section>

  <footer class="wrap footer">
    <p id="published-at" class="muted"></p>
    <p id="disclaimer" class="muted small">الأسعار والتفاصيل قابلة للتغيير — للتأكد تواصل معنا مباشرة.</p>
  </footer>

  <noscript><p class="wrap">هذه الصفحة تحتاج تفعيل JavaScript لعرض العروض.</p></noscript>
  <script type="module" src="./app.js"></script>
</body>
</html>
