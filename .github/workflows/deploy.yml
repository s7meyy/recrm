# مسار نشرٍ احتياطي إلى Netlify (المرحلة ٣٣).
#
# **النشر التلقائي من Netlify يعمل** منذ ١٥ سبتمبر ٢٠٢٦ (أول نشرة ناجحة: `c29ddfa`)،
# فهذا الملف **شبكة أمان لا مسار أوّل**: يعمل متى انقطع ذلك الربط مرّة أخرى، بمفتاحٍ
# تملكه أنت ولا يعتمد على خطّاف قد يسقط.
#
# **ولا يفشل حين لا يجد المفتاح** — يمرّ بملاحظة. فالفشل الأحمر عند كل دفعة وأنت لا تحتاجه
# ضجيجٌ يُعلّمك تجاهل الإشارة، حتى إذا جاء فشلٌ حقيقي لم تنظر إليه.
#
# **لتشغيله:** أضف سرًّا واحدًا في Settings ← Secrets and variables ← Actions ← Secrets:
#   NETLIFY_AUTH_TOKEN  من Netlify: User settings ← Applications ← Personal access tokens
#
# ومعرّف المشروع مكتوب هنا صراحةً لأنه **ليس سرًّا**: يظهر في رابط لوحة Netlify نفسها،
# ولا يفعل به أحدٌ شيئًا بلا التوكن.

name: نشر إلى Netlify (احتياطي)

on:
  push:
    branches: [main]
  workflow_dispatch: # زرّ يدوي في تبويب Actions للنشر عند الحاجة

concurrency:
  group: netlify-deploy
  cancel-in-progress: true # نشرتان متلاحقتان: الأحدث تكفي

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # يشخّص الخطأ الشائع ولا يكتفي بقول «ناقص»: أشيع سببٍ أن يوضع المفتاح في تبويب
      # Variables أو Codespaces أو Dependabot بدل Secrets ← Actions، فتبدو الإضافة ناجحة
      # ويبقى المتغيّر فارغًا. فنقرأ Variables أيضًا كي نسمّي الخطأ بعينه.
      - name: تحقّق من التوكن
        id: guard
        env:
          TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          TOKEN_AS_VAR: ${{ vars.NETLIFY_AUTH_TOKEN }}
        run: |
          if [ -n "$TOKEN" ]; then
            echo "has_token=true" >> "$GITHUB_OUTPUT"
            echo "التوكن موجود (${#TOKEN} حرفًا) — يُنشر من هنا."
            exit 0
          fi
          echo "has_token=false" >> "$GITHUB_OUTPUT"
          if [ -n "$TOKEN_AS_VAR" ]; then
            echo "::warning::NETLIFY_AUTH_TOKEN موضوع في تبويب Variables لا Secrets، فلا تراه الوظيفة. انقله إلى: Settings ← Secrets and variables ← Actions ← Secrets."
          else
            echo "::notice::لا توكن — يُتخطّى المسار الاحتياطي. والنشر يجري من ربط Netlify نفسه، وهذا هو المتوقَّع ما دام ذلك الربط يعمل."
          fi

      - name: تثبيت تبعيات الدوال
        if: steps.guard.outputs.has_token == 'true'
        # لا ملف قفل في المستودع (التطبيق بلا أداة بناء، والتبعيتان للدوال وحدها)،
        # فـ`npm install` هو الصحيح هنا لا `npm ci`.
        run: npm install --omit=dev

      # رسالة النشرة تُمرَّر **متغيّرَ بيئة لا استبدالًا نصّيًا**: نصّ الالتزام يكتبه بشر،
      # وحقنه في سطر الصدفة مباشرةً بابٌ لتنفيذ ما ليس منه.
      # الأداة بإصدارٍ مثبَّت لا بـ@latest، ومعها تجاوزٌ لتبعية مكسورة عند مصدرها:
      # @types/node@26.6.0 مُدرَج في سجلّ npm وملفُّه مفقود (404)، فتسقط كل نشرة
      # تحلّ التبعيات من جديد. وقع هذا فعلًا في نشرة رابح، وهذا الملف كان سيلقاه.
      - name: تثبيت أداة Netlify
        if: steps.guard.outputs.has_token == 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/nl"
          cat > "$RUNNER_TEMP/nl/package.json" <<'JSON'
          {
            "name": "netlify-deploy-runner",
            "private": true,
            "dependencies": { "netlify-cli": "27.7.0" },
            "overrides": { "@types/node": "26.5.1" }
          }
          JSON
          cd "$RUNNER_TEMP/nl"
          npm install --no-audit --no-fund
          echo "$RUNNER_TEMP/nl/node_modules/.bin" >> "$GITHUB_PATH"

      - name: نشر
        if: steps.guard.outputs.has_token == 'true'
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID || '8fab1119-ac3c-4473-8fea-ea61abab8ab6' }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          netlify deploy --prod --no-build --message "${COMMIT_MESSAGE:-نشر يدوي}"
