# إعداد النشر على Netlify (المرحلة ٩).
# لا أداة بناء للتطبيق نفسه: الملفات تُنشر كما هي من جذر المستودع (نفس مبدأ المشروع منذ المرحلة ١).
# npm install يعمل فقط لتبعية واحدة تخص الدوال الخادمية (@netlify/blobs)، ولا يمسّ كود التطبيق.

[build]
  publish = "."
  # بلا أمر بناء: التطبيق يُنشر كما هو. Netlify يثبّت تبعيات الدوال تلقائيًا من package.json.

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# لا تخزين مؤقت لصفحة التطبيق نفسها كي يصل التحديث فور النشر.
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/offers/*"
  [headers.values]
    Cache-Control = "no-cache"
